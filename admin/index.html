<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Calendário de reservas | Orlando Rent Homes</title>
  <style>
    :root{--navy:#073a50;--aqua:#1eb5c9;--ink:#132630;--muted:#60727a;--line:#dbe3e4;--bg:#eef6f7;--error:#a02c2c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{width:min(760px,calc(100% - 28px));margin:32px auto}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:22px}.top a{color:var(--navy);font-weight:800;text-decoration:none}.card{background:#fff;border-radius:22px;padding:clamp(22px,5vw,40px);box-shadow:0 20px 50px rgba(5,43,59,.12)}h1{font:500 clamp(2rem,6vw,3.5rem)/1.05 Georgia,serif;color:var(--navy);margin:0 0 10px}h2{color:var(--navy);font-size:1.08rem}p{color:var(--muted)}.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:24px 0 14px}label{font-size:.86rem;font-weight:800;color:var(--navy)}input{width:100%;display:block;margin-top:7px;min-height:50px;border:1px solid var(--line);border-radius:12px;padding:0 13px;font:inherit}.actions{display:flex;gap:10px;flex-wrap:wrap}button{min-height:48px;border:0;border-radius:999px;padding:0 21px;font-weight:800;cursor:pointer}.primary{background:var(--aqua);color:#052b3b}.secondary{background:#fff;color:var(--navy);border:1px solid var(--line)}button:disabled{opacity:.55;cursor:wait}.status{min-height:24px;margin:14px 0}.status.error{color:var(--error)}.reserved{margin-top:28px;border-top:1px solid var(--line);padding-top:20px}.reserved-list{display:flex;flex-wrap:wrap;gap:8px}.date-chip{background:#edf5f6;border:1px solid #d8e6e8;border-radius:999px;padding:7px 11px;font-size:.84rem;color:var(--navy)}.empty{font-size:.92rem;color:var(--muted)}@media(max-width:560px){.wrap{margin:18px auto}.fields{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="top"><strong>Orlando Rent Homes</strong><a href="../">Voltar ao site</a></div>
    <section class="card">
      <h1>Calendário de reservas</h1>
      <p>Marque o período que já foi alugado. Os visitantes verão esses dias como reservados e não poderão selecioná-los.</p>
      <div class="fields">
        <label>Primeiro dia<input id="start" type="date"></label>
        <label>Último dia<input id="end" type="date"></label>
      </div>
      <div class="actions"><button class="primary" id="save" type="button">Marcar como reservado</button><button class="secondary" id="free" type="button">Liberar período</button></div>
      <p class="status" id="status" aria-live="polite"></p>
      <div class="reserved"><h2>Dias atualmente reservados</h2><div class="reserved-list" id="reserved-list"><span class="empty">Carregando…</span></div></div>
    </section>
  </main>
  <script>
    const SUPABASE_URL='https://bmoeknvuxrndlfairyth.supabase.co';
    const SUPABASE_KEY='sb_publishable_lagn5A2PP6V6kT_G9hvM3Q_kzIamfaz';
    const statusEl=document.querySelector('#status'),list=document.querySelector('#reserved-list');
    function datesBetween(start,end){const dates=[],current=new Date(start+'T12:00:00'),last=new Date(end+'T12:00:00');while(current<=last){dates.push(current.toISOString().slice(0,10));current.setDate(current.getDate()+1)}return dates}
    function fmt(date){return new Intl.DateTimeFormat('pt-BR',{day:'2-digit',month:'short',year:'numeric',timeZone:'UTC'}).format(new Date(date+'T12:00:00Z'))}
    async function loadReservations(){const response=await fetch(`${SUPABASE_URL}/rest/v1/reservas?select=data&order=data.asc`,{headers:{apikey:SUPABASE_KEY}});if(!response.ok){statusEl.textContent='A tabela de reservas ainda precisa ser configurada no Supabase.';statusEl.className='status error';list.innerHTML='<span class="empty">Nenhuma reserva carregada.</span>';return}const rows=await response.json();list.innerHTML=rows.length?rows.map(row=>`<span class="date-chip">${fmt(row.data)}</span>`).join(''):'<span class="empty">Nenhuma data reservada.</span>'}
    async function change(mode){const start=document.querySelector('#start').value,end=document.querySelector('#end').value;if(!start||!end||end<start){statusEl.textContent='Escolha um período válido.';statusEl.className='status error';return}const dates=datesBetween(start,end),button=document.querySelector(mode==='save'?'#save':'#free');button.disabled=true;statusEl.textContent='Salvando…';statusEl.className='status';let response;if(mode==='save'){response=await fetch(`${SUPABASE_URL}/rest/v1/reservas?on_conflict=data`,{method:'POST',headers:{apikey:SUPABASE_KEY,'content-type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(dates.map(data=>({data,observacao:'Reserva'})))})}else{response=await fetch(`${SUPABASE_URL}/rest/v1/reservas?data=in.(${dates.join(',')})`,{method:'DELETE',headers:{apikey:SUPABASE_KEY}})}button.disabled=false;if(!response.ok){statusEl.textContent='O Supabase ainda não permite alterar as reservas. Execute o SQL de configuração.';statusEl.className='status error';return}statusEl.textContent=mode==='save'?'Período marcado como reservado.':'Período liberado.';loadReservations()}
    document.querySelector('#save').addEventListener('click',()=>change('save'));
    document.querySelector('#free').addEventListener('click',()=>change('free'));
    loadReservations();
  </script>
</body>
</html>
